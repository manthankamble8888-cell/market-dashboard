<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;margin:0;padding:16px}
h2{font-size:15px;color:#94a3b8;margin:20px 0 8px;text-transform:uppercase;letter-spacing:1px}
.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.left{display:flex;flex-direction:column}
.name{font-size:14px;color:#cbd5e1}
.badge{font-size:11px;margin-top:4px;width:fit-content;padding:2px 8px;border-radius:8px}
.open{background:#14532d;color:#4ade80}
.closed{background:#450a0a;color:#f87171}
.price{font-size:20px;font-weight:bold}
.up{color:#22c55e}.down{color:#ef4444}
.news-item{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:8px}
.news-item a{color:#e2e8f0;font-size:14px;text-decoration:none}
.news-time{color:#64748b;font-size:11px;margin-top:4px;display:block}
#updated{font-size:12px;color:#64748b;margin-top:20px}
</style></head><body>
<h1>📊 Market Dashboard</h1>
<div id="cards">Loading...</div>
<div id="updated"></div>
<script>
const groups = {
  "Indian Indices": ["Nifty 50","Bank Nifty","Sensex","India VIX","Nifty IT","Nifty Midcap"],
  "Asian Markets": ["Nikkei 225","Hang Seng"],
  "Global Cues": ["Dow Jones","Nasdaq","S&P 500"],
  "Commodities & Currency": ["Crude Oil (Brent)","Crude Oil (WTI)","Gold","Silver","USD/INR","Dollar Index"],
  "Bonds": ["US 10Y Yield"]
};

function getISTParts(){
  const now = new Date();
  const ist = new Date(now.toLocaleString("en-US",{timeZone:"Asia/Kolkata"}));
  return {day: ist.getDay(), mins: ist.getHours()*60 + ist.getMinutes()};
}
function isOpen(key){
  const {day, mins} = getISTParts();
  const isWeekday = day>=1 && day<=5;
  if(["Nifty 50","Bank Nifty","Sensex","India VIX","Nifty IT","Nifty Midcap"].includes(key)) return isWeekday && mins>=555 && mins<=930;
  if(["Dow Jones","Nasdaq","S&P 500","US 10Y Yield"].includes(key)) return isWeekday && (mins>=1140 || mins<=90);
  if(["Nikkei 225"].includes(key)) return isWeekday && mins>=330 && mins<=690;
  if(["Hang Seng"].includes(key)) return isWeekday && mins>=390 && mins<=750;
  if(["Crude Oil (Brent)","Crude Oil (WTI)","Gold","Silver"].includes(key)) return !(mins>=210 && mins<=240);
  if(["USD/INR","Dollar Index"].includes(key)) return isWeekday && mins>=540 && mins<=1020;
  return true;
}

async function loadData(){
  try{
    const res = await fetch('data.json?t='+Date.now());
    const data = await res.json();
    const c = document.getElementById('cards'); c.innerHTML='';
    for(const groupName in groups){
      c.innerHTML += `<h2>${groupName}</h2>`;
      groups[groupName].forEach(key=>{
        const item = data[key];
        if(!item) return;
        if(item.error){
          c.innerHTML += `<div class="card"><span class="name">${key}</span><span style="color:#64748b">N/A</span></div>`;
          return;
        }
        const dir = item.pct>=0?'up':'down';
        const arrow = item.pct>=0?'▲':'▼';
        const open = isOpen(key);
        c.innerHTML += `<div class="card">
          <div class="left"><span class="name">${key}</span><span class="badge ${open?'open':'closed'}">${open?'OPEN':'CLOSED'}</span></div>
          <span><span class="price">${item.price}</span> <span class="${dir}">${arrow} ${item.pct}%</span></span>
        </div>`;
      });
    }
    if(data.news && data.news.length){
      c.innerHTML += `<h2>Market News</h2>`;
      data.news.forEach(n=>{
        c.innerHTML += `<div class="news-item"><a href="${n.link}" target="_blank">${n.title}</a><span class="news-time">${n.published}</span></div>`;
      });
    }
    document.getElementById('updated').innerText='Last updated: '+data.last_updated+' (IST = UTC+5:30)';
  }catch(e){document.getElementById('cards').innerText='Failed to load data.';}
}
loadData(); setInterval(loadData,60000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script></body></html>
