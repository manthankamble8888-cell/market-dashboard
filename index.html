<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;margin:0;padding:16px}
.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:12px}
.name{font-size:14px;color:#94a3b8}.price{font-size:24px;font-weight:bold}
.up{color:#22c55e}.down{color:#ef4444}
#updated{font-size:12px;color:#64748b;margin-top:20px}
</style></head><body>
<h1>📊 Market Dashboard</h1>
<div id="cards">Loading...</div>
<div id="updated"></div>
<script>
async function loadData(){
  try{
    const res = await fetch('data.json?t='+Date.now());
    const data = await res.json();
    const c = document.getElementById('cards'); c.innerHTML='';
    for(const key in data){
      if(key==='last_updated') continue;
      const item = data[key];
      const dir = item.pct>=0?'up':'down';
      const arrow = item.pct>=0?'▲':'▼';
      c.innerHTML += `<div class="card"><div class="name">${key}</div><div class="price">${item.price??'N/A'}</div><div class="${dir}">${arrow} ${item.pct??''}%</div></div>`;
    }
    document.getElementById('updated').innerText='Last updated: '+data.last_updated;
  }catch(e){document.getElementById('cards').innerText='Failed to load data.';}
}
loadData(); setInterval(loadData,60000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script></body></html>
